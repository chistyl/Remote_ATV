name: Remote ATV 5.0.5 focused AOT disassembly

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/disasm-only.yml'

permissions:
  contents: read

jobs:
  disasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install disassembly libraries
        run: sudo apt-get update && sudo apt-get install -y python3-pyelftools python3-capstone
      - name: Extract exact 5.0.5 AOT library
        run: |
          set -euo pipefail
          mkdir -p work/lib work/diag
          unzip -p "input/Remote_ATV_5.0.5_繁體中文_候選版.apk" lib/arm64-v8a/libapp.so > work/lib/libapp.so
          sha256sum work/lib/libapp.so > work/diag/sha256.txt
      - name: Disassemble target functions and call sites
        run: |
          cat > work/diag/disassemble.py <<'PY'
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          from pathlib import Path
          centers=[0x7505e8,0x750634,0x750228,0x752874,0x4ab5ac,0x4ab8d0,0x4ab96c,0x4aba08,0x4abd40,0x44ee94,0x44dff4,0x44d848,0x44d7d4,0x44c070,0x44c0d4,0x44c250,0x44c3a0,0x44c464,0x44c500,0x44c600,0x44c700,0x44c00c,0x44bfa8,0x44bd30,0x44c4f0,0x44c48c,0x4aeec0,0x44f90c,0x44f88c,0x44f7b4,0x44f734,0x43b6a8,0x327460,0x325e38,0x325e30,0x323c14,0x323c9c,0x444200,0x4449a8,0x444fe4,0x444134,0x443ff0,0x443fa4,0x4426ec,0x441ed8,0x4419c8,0x44140c,0x440dec,0x43f518,0x43eff4,0x43e718,0x43e5c4,0x43e398,0x43e1e8,0x43e18c,0x43e03c,0x43dd20,0x5a6e78,0x716504,0x74bc08,0x74bc9c,0x74be34,0x435648]
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          path=Path("work/lib/libapp.so")
          with path.open("rb") as f:
              elf=ELFFile(f); segs=[s for s in elf.iter_segments() if s['p_type']=='PT_LOAD' and (int(s['p_flags'])&1)]
              out=[]
              for center in centers:
                  seg=next((s for s in segs if int(s['p_vaddr'])<=center<int(s['p_vaddr'])+int(s['p_filesz'])),None)
                  if seg is None:
                      out.append(f"===== 0x{center:x}: not executable ====="); continue
                  start=max(int(seg['p_vaddr']),center-0x100); end=min(int(seg['p_vaddr'])+int(seg['p_filesz']),center+0x180)
                  off=int(seg['p_offset'])+start-int(seg['p_vaddr']); f.seek(off); data=f.read(end-start)
                  out.append(f"===== 0x{center:x} =====")
                  for i in md.disasm(data,start):
                      out.append(f"{'>>>' if i.address==center else '   '} 0x{i.address:08x}: {i.mnemonic:8s} {i.op_str}")
          Path("work/diag/disassembly.txt").write_text("\\n".join(out),encoding="utf-8")
          # Dump the full suspected settings/menu builder function range.
          start,end=0x43b6fc,0x43dac8
          seg=next((s for s in segs if int(s['p_vaddr'])<=start and end<=int(s['p_vaddr'])+int(s['p_filesz'])),None)
          if seg is None:
              raise SystemExit("Menu builder range is outside executable PT_LOAD.")
          off=int(seg['p_offset'])+start-int(seg['p_vaddr'])
          with path.open("rb") as f2:
              f2.seek(off); data=f2.read(end-start)
          lines=[f"===== suspected menu builder 0x{start:x}-0x{end:x} ====="]
          for i in md.disasm(data,start):
              lines.append(f"0x{i.address:08x}: {i.mnemonic:8s} {i.op_str}")
          Path("work/diag/menu-builder-range.txt").write_text("\\n".join(lines),encoding="utf-8")
          # Dump row-construction helper functions called by the settings page.
          helper_ranges=[(0x444200,0x444900),(0x4449a8,0x444fe4),(0x443fa4,0x444134),(0x440dec,0x44140c),(0x44c800,0x44d600),(0x453700,0x453900),(0x25d400,0x25d600),(0x265200,0x265400),(0x282200,0x282400),(0x3a0300,0x3a0500)]
          with path.open("rb") as hf:
              elf3=ELFFile(hf)
              hsegs=[s for s in elf3.iter_segments() if s['p_type']=='PT_LOAD' and (int(s['p_flags'])&1)]
              hlines=[]
              for hs,he in helper_ranges:
                  sg=next((q for q in hsegs if int(q['p_vaddr'])<=hs and he<=int(q['p_vaddr'])+int(q['p_filesz'])),None)
                  if sg is None:
                      hlines.append(f"===== helper 0x{hs:x}-0x{he:x}: not executable =====")
                      continue
                  hf.seek(int(sg['p_offset'])+hs-int(sg['p_vaddr']))
                  hd=hf.read(he-hs)
                  hlines.append(f"===== helper 0x{hs:x}-0x{he:x} =====")
                  hlines.extend(f"0x{i.address:08x}: {i.mnemonic:8s} {i.op_str}" for i in md.disasm(hd,hs))
          Path("work/diag/menu-helper-ranges.txt").write_text("\\n".join(hlines),encoding="utf-8")
          # Scan all executable AOT code for references to the menu item constants and enum defaults.
          import re
          targets={
              0x12:{0x970:"share.svg",0x978:"share callback",0x980:"review.svg",0x988:"review callback",0x990:"feedback.svg",0x998:"feedback callback",0x9a0:"subpage arrow",0x9a8:"subpage callback",0x9b0:"premium.svg",0x9b8:"premium callback",0x9c0:"menu callback"},
              0x20:{0x5d8:"navigation touchpad enum",0x5e0:"navigation dpad enum",0x5e8:"quick apps enum",0x5f0:"quick buttons enum",0x5f8:"quick none enum",0x618:"navigation_choice key",0x620:"quick_access_choice key"}
          }
          refs=[]
          with path.open("rb") as scan_f:
              elf2=ELFFile(scan_f)
              for seg2 in elf2.iter_segments():
                  if seg2['p_type']!='PT_LOAD' or not (int(seg2['p_flags'])&1):
                      continue
                  code=seg2.data(); base=int(seg2['p_vaddr'])
                  ins=list(md.disasm(code,base))
                  for idx,inst in enumerate(ins):
                      if inst.mnemonic!="add":
                          continue
                      parts=[x.strip() for x in inst.op_str.split(",")]
                      if len(parts)<4 or parts[1]!="x27":
                          continue
                      page_text=parts[2]
                      m=re.fullmatch(r"#0x([0-9a-fA-F]+)",page_text)
                      if not m or parts[3]!="lsl #12":
                          continue
                      page=int(m.group(1),16)
                      if page not in targets:
                          continue
                      dest=parts[0]
                      for nxt in ins[idx+1:idx+4]:
                          if nxt.mnemonic!="ldr":
                              continue
                          mm=re.fullmatch(r"[^,]+, \["+re.escape(dest)+r", #0x([0-9a-fA-F]+)\]",nxt.op_str)
                          if not mm:
                              continue
                          off=int(mm.group(1),16)
                          if off not in targets[page]:
                              continue
                          refs.append((inst.address,nxt.address,page,off,targets[page][off],ins[max(0,idx-5):min(len(ins),idx+7)]))
          outrefs=[]
          for a,b,page,off,label,window in refs:
              outrefs.append(f"===== PP+0x{page:x}{off:03x} ({label}) referenced near 0x{a:x} =====")
              outrefs.extend(f"0x{x.address:08x}: {x.mnemonic:8s} {x.op_str}" for x in window)
          Path("work/diag/pp-constant-xrefs.txt").write_text("\\n".join(outrefs),encoding="utf-8")
          print(f"Found {len(refs)} PP constant references for menu and enum targets.")
          # Robust string-based scan of settings callbacks and UI labels.
          direct_targets={0x970:"share.svg",0x978:"share callback",0x980:"review.svg",0x988:"review callback",0x990:"feedback.svg",0x998:"feedback callback",0x9a0:"subpage arrow",0x9a8:"subpage callback",0x9b0:"premium.svg",0x9b8:"premium callback",0x9c0:"menu callback"}
          direct_refs=[]
          semantic_targets={0x38:{0xc58:"Feedback label"},0x39:{0x8e0:"Activate premium label",0x9c8:"Rate and Review label",0x9d0:"Share with friends label"},0x12:{0x970:"share.svg",0x978:"share callback",0x980:"review.svg",0x988:"review callback",0x990:"feedback.svg",0x998:"feedback callback",0x9a0:"subpage arrow",0x9a8:"subpage callback",0x9b0:"premium.svg",0x9b8:"premium callback",0xb98:"feedback_clicked",0xba8:"rate_and_review_clicked",0xbf0:"share_with_friends_clicked"}}
          semantic_refs=[]
          md.skipdata=True
          with path.open("rb") as scan_f:
              elf5=ELFFile(scan_f)
              for seg5 in elf5.iter_segments():
                  if seg5['p_type']!='PT_LOAD' or not (int(seg5['p_flags'])&1):
                      continue
                  scan_f.seek(int(seg5['p_offset']))
                  code5=scan_f.read(int(seg5['p_filesz']))
                  ins5=list(md.disasm(code5,int(seg5['p_vaddr'])))
                  for idx5,inst5 in enumerate(ins5):
                      if inst5.mnemonic=="ldr":
                          for off5,label5 in direct_targets.items():
                              if f"[x27, #0x{off5:x}]" in inst5.op_str:
                                  direct_refs.append((inst5.address,off5,label5,ins5[max(0,idx5-8):min(len(ins5),idx5+10)]))
                      if inst5.mnemonic!="add":
                          continue
                      parts5=[q.strip() for q in inst5.op_str.split(",")]
                      if len(parts5)<4 or parts5[1]!="x27" or parts5[3]!="lsl #12":
                          continue
                      try: page5=int(parts5[2].replace("#",""),16)
                      except ValueError: continue
                      if page5 not in semantic_targets: continue
                      dest5=parts5[0]
                      for nxt5 in ins5[idx5+1:idx5+4]:
                          if nxt5.mnemonic!="ldr": continue
                          for off5,label5 in semantic_targets[page5].items():
                              if f"[{dest5}, #0x{off5:x}]" in nxt5.op_str:
                                  semantic_refs.append((inst5.address,page5,off5,label5,ins5[max(0,idx5-8):min(len(ins5),idx5+12)]))
          dlines=[]
          for addr5,off5,label5,window5 in direct_refs:
              dlines.append(f"===== PP+0x{off5:x} ({label5}) referenced at 0x{addr5:x} =====")
              dlines.extend(f"0x{x.address:08x}: {x.mnemonic:8s} {x.op_str}" for x in window5)
          Path("work/diag/direct-menu-callback-xrefs.txt").write_text("\\n".join(dlines),encoding="utf-8")
          slines=[]
          for addr5,page5,off5,label5,window5 in semantic_refs:
              slines.append(f"===== PP+0x{page5:x}{off5:03x} ({label5}) referenced near 0x{addr5:x} =====")
              slines.extend(f"0x{x.address:08x}: {x.mnemonic:8s} {x.op_str}" for x in window5)
          Path("work/diag/semantic-settings-xrefs.txt").write_text("\\n".join(slines),encoding="utf-8")
          print(f"Found {len(direct_refs)} direct callback references and {len(semantic_refs)} semantic UI references.")
          PY
          python3 work/diag/disassemble.py
      - name: Upload exact AOT and disassembly
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-focused-disassembly
          path: |
            work/lib/libapp.so
            work/diag/
          retention-days: 14

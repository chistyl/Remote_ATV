name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Prepare, analyze and build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.27.4 (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Show toolchain versions
        run: |
          mkdir -p ci-reports
          {
            flutter --version
            dart --version
            java -version
            python --version
          } 2>&1 | tee ci-reports/toolchain.txt

      - name: Verify app version consistency
        run: python tools/version_consistency.py

      - name: Prepare and verify real Gradle Wrapper
        id: wrapper
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_prepare_android.py 2>&1 | tee ci-reports/wrapper-test.log
          python tools/prepare_android.py 2>&1 | tee ci-reports/wrapper-prepare.log
          python tools/gradle_compatibility.py 2>&1 | tee ci-reports/gradle-compatibility.log
          test -x android/gradlew
          test -f android/gradlew.bat
          test -f android/gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.7-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          cp android/gradle/wrapper/gradle-wrapper.properties ci-reports/gradle-wrapper.properties

      - name: Resolve Flutter dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ci-reports/pub-get.log
          test -s pubspec.lock
          cp pubspec.lock ci-reports/pubspec.lock
          sha256sum pubspec.lock | tee ci-reports/pubspec-lock.sha256

      - name: Build and verify Debug APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build_debug.sh 2>&1 | tee ci-reports/build.log

      - name: Collect APK inspection metadata
        if: success() && steps.build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p ci-reports
          python tools/verify_apk.py build/app/outputs/flutter-apk/app-debug.apk --report ci-reports/apk-inspection.json

      - name: Collect build report
        if: always()
        shell: bash
        env:
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p ci-reports
          {
            APP_VERSION="$(sed -n 's/^version: \\([^+]*\\)+.*/\\1/p' pubspec.yaml)"
            APP_BUILD="$(sed -n 's/^version: [^+]*+\\([0-9]*\\)$/\\1/p' pubspec.yaml)"
            echo "Remote ATV ${APP_VERSION} CI Build Report (Build ${APP_BUILD})"
            echo "Wrapper preparation outcome: ${WRAPPER_OUTCOME:-not_started}"
            echo "Dependency resolution outcome: ${DEPENDENCY_OUTCOME:-not_started}"
            echo "Build outcome: ${BUILD_OUTCOME:-not_started}"
            echo "Commit: ${COMMIT_SHA}"
            echo "Ref: ${REF_NAME}"
            echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- Toolchain ---"
            flutter --version 2>&1 || true
            dart --version 2>&1 || true
            java -version 2>&1 || true
            python --version 2>&1 || true
            echo
            echo "--- Gradle Wrapper ---"
            if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then cat android/gradle/wrapper/gradle-wrapper.properties; else echo "Gradle Wrapper was not prepared."; fi
            echo
            echo "--- Dependency resolution ---"
            if [ -f pubspec.lock ]; then
              cp pubspec.lock ci-reports/pubspec.lock
              sha256sum pubspec.lock
            else
              echo "pubspec.lock was not generated."
            fi
            echo
            echo "--- APK ---"
            APK="build/app/outputs/flutter-apk/app-debug.apk"
            if [ -f "$APK" ]; then
              ls -lh "$APK"
              sha256sum "$APK"
            else
              echo "APK was not produced."
            fi
          } > ci-reports/build-report.txt

      - name: Upload Debug APK
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: remote-atv-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            ci-reports/apk-inspection.json
            ci-reports/pubspec.lock
            ci-reports/pubspec-lock.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-atv-build-diagnostics
          path: ci-reports/
          if-no-files-found: warn
          retention-days: 14

  patch-target-505:
    name: Patch original Remote ATV 5.0.5 update dialog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact 5.0.5 input
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch and verify the dialog dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, struct, zipfile
          from pathlib import Path
          src=Path("input/Remote_ATV_5.0.5_繁體中文_候選版.apk")
          unsigned=Path("Remote_ATV_5.0.5_停用更新資訊提示_除錯版-unsigned.apk")
          expected_apk="8a7a682daf4ea69641d28d800b0a521b8273b59a98e36319482b1013a87a30ef"
          expected_lib="a2b7d7a37020a462dab8230f99fd10c00e927257328730af1f54856358ca6875"
          va=0x7505e8
          old=bytes.fromhex("13000094")
          new=bytes.fromhex("e00316aa")
          sha=lambda b: hashlib.sha256(b).hexdigest()
          if not src.is_file() or sha(src.read_bytes()) != expected_apk:
              raise SystemExit("Target APK missing or SHA256 mismatch.")
          with zipfile.ZipFile(src) as zin:
              libname="lib/arm64-v8a/libapp.so"
              lib=zin.read(libname)
              if sha(lib) != expected_lib: raise SystemExit("AOT snapshot SHA256 mismatch.")
              if lib[:4] != bytes((127,69,76,70)) or lib[4] != 2 or lib[5] != 1: raise SystemExit("Unexpected ELF format.")
              phoff=struct.unpack_from("<Q",lib,32)[0]
              pe,pn=struct.unpack_from("<HH",lib,54)
              off=None
              for i in range(pn):
                  p=phoff+i*pe
                  typ,flags,po,pv,_,fs,_,_=struct.unpack_from("<IIQQQQQQ",lib,p)
                  if typ==1 and flags&1 and pv<=va and va+4<=pv+fs:
                      off=po+va-pv; break
              if off is None or lib[off:off+4] != old: raise SystemExit("Expected BL 0x750634 not found.")
              ins=struct.unpack("<I",old)[0]; imm=ins&0x03ffffff
              if imm&(1<<25): imm-=1<<26
              if va+(imm<<2)!=0x750634: raise SystemExit("BL target mismatch.")
              patched=bytearray(lib); patched[off:off+4]=new
              with zipfile.ZipFile(unsigned,"w") as zout:
                  for info in zin.infolist():
                      data=bytes(patched) if info.filename==libname else zin.read(info.filename)
                      zout.writestr(info,data)
          with zipfile.ZipFile(src) as original, zipfile.ZipFile(unsigned) as result:
              assert result.testzip() is None
              assert result.read(libname)[off:off+4]==new
              assert set(original.namelist())==set(result.namelist())
              for name in original.namelist():
                  if name!=libname: assert original.read(name)==result.read(name), name
          print("Original APK SHA256:",expected_apk)
          print("Original libapp SHA256:",expected_lib)
          print("Patch VA 0x7505e8 / file offset 0x%x" % off)
          print("BL 0x750634 -> mov x0, x22 (Dart null)")
          print("Only libapp.so changed; all other APK entries identical.")
          PY

      - name: Align and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "build-tools;35.0.0"
          BT="$SDK_ROOT/build-tools/35.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          export PATH="$BT:$PATH"
          zipalign -f -p 4 "Remote_ATV_5.0.5_停用更新資訊提示_除錯版-unsigned.apk" "Remote_ATV_5.0.5_停用更新資訊提示_除錯版-aligned.apk"
          keytool -genkeypair -keystore test-debug.keystore -storepass android -alias remote-atv-test -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Remote ATV Test,O=Debug,C=TW"
          apksigner sign --ks test-debug.keystore --ks-key-alias remote-atv-test --ks-pass pass:android --key-pass pass:android --out "Remote_ATV_5.0.5_停用更新資訊提示_除錯版.apk" "Remote_ATV_5.0.5_停用更新資訊提示_除錯版-aligned.apk"
          apksigner verify --verbose --print-certs "Remote_ATV_5.0.5_停用更新資訊提示_除錯版.apk"
          zipalign -c -p 4 "Remote_ATV_5.0.5_停用更新資訊提示_除錯版.apk"

      - name: Final APK checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, struct, zipfile
          p="Remote_ATV_5.0.5_停用更新資訊提示_除錯版.apk"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              lib=z.read("lib/arm64-v8a/libapp.so")
              assert lib[0x7505e8:0x7505ec]==bytes.fromhex("e00316aa")
              assert "AndroidManifest.xml" in z.namelist()
          print("APK ZIP integrity: PASS")
          print("Patched AOT instruction: PASS")
          print("Manifest presence: PASS")
          print("Signed APK SHA256:",hashlib.sha256(open(p,"rb").read()).hexdigest())
          PY

      - name: Upload patched 5.0.5 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-no-update-dialog-debug
          path: |
            Remote_ATV_5.0.5_停用更新資訊提示_除錯版.apk
            Remote_ATV_5.0.5_停用更新資訊提示_除錯版-unsigned.apk
          if-no-files-found: error
          retention-days: 14

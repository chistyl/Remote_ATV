name: Sign Remote ATV 5.0.5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input APK
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_停用更新檢查_候選版.apk"
          test -s "$APK" || { echo "::error::Missing $APK. Upload the modified 5.0.5 candidate APK to this path first."; exit 1; }
          echo "APK_INPUT=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Install Android Build Tools
        uses: android-actions/setup-android@v3
      - name: Install build-tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Remove old signatures and align APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output
          cp "$APK_INPUT" work/input.apk
          zip -q -d work/input.apk 'META-INF/MANIFEST.MF' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 work/input.apk work/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 work/aligned.apk

      - name: Generate temporary signing key and sign with apksigner
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore work/remote-atv-release.jks \
            -storepass "remoteatv-temp-signing-pass-2026" \
            -keypass "remoteatv-temp-signing-pass-2026" \
            -alias remoteatv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Remote ATV 5.0.5 Local Rebuild"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks work/remote-atv-release.jks \
            --ks-key-alias remoteatv \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out output/Remote_ATV_5.0.5_signed.apk \
            work/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Remote_ATV_5.0.5_signed.apk
          unzip -t output/Remote_ATV_5.0.5_signed.apk
          sha256sum output/Remote_ATV_5.0.5_signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-signed
          path: output/Remote_ATV_5.0.5_signed.apk
          if-no-files-found: error
          retention-days: 14

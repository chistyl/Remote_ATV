name: Patch Remote ATV 5.0.5 - hide update dialog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-disable-update-dialog.yml'

permissions:
  contents: read

jobs:
  patch-and-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 5.0.5 input
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch first-install remote defaults in Android startup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          src=Path("input/Remote_ATV_5.0.5_繁體中文_候選版.apk")
          expected="8a7a682daf4ea69641d28d800b0a521b8273b59a98e36319482b1013a87a30ef"
          if hashlib.sha256(src.read_bytes()).hexdigest()!=expected:
              raise SystemExit("Exact 5.0.5 source APK SHA256 mismatch.")
          PY
          apktool d -f -r "input/Remote_ATV_5.0.5_繁體中文_候選版.apk" -o work/apk
          MAIN="work/apk/smali_classes3/tech/simha/androidtvremote/MainActivity.smali"
          test -f "$MAIN"
          grep -q 'FlutterSharedPreferences' work/apk/smali_classes2/a6/a.smali
          grep -q 'const-string.*flutter\.' work/apk/smali_classes2/a6/a.smali
          python3 - <<'PY'
          from pathlib import Path
          p=Path("work/apk/smali_classes3/tech/simha/androidtvremote/MainActivity.smali")
          s=p.read_text()
          if "onCreate(Landroid/os/Bundle;)V" in s:
              raise SystemExit("MainActivity already overrides onCreate; refusing to overwrite unknown startup logic.")
          method="""

          .method protected onCreate(Landroid/os/Bundle;)V
              .locals 4

              const-string v0, "FlutterSharedPreferences"
              const/4 v1, 0x0
              invoke-virtual {p0, v0, v1}, Landroid/content/Context;->getSharedPreferences(Ljava/lang/String;I)Landroid/content/SharedPreferences;
              move-result-object v0

              invoke-interface {v0}, Landroid/content/SharedPreferences;->edit()Landroid/content/SharedPreferences$Editor;
              move-result-object v1

              const-string v2, "flutter.navigation_choice"
              invoke-interface {v0, v2}, Landroid/content/SharedPreferences;->contains(Ljava/lang/String;)Z
              move-result v3
              if-nez v3, :cond_navigation_exists
              const-string v3, "dpad"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;
              move-result-object v1
              :cond_navigation_exists

              const-string v2, "flutter.quick_access_choice"
              invoke-interface {v0, v2}, Landroid/content/SharedPreferences;->contains(Ljava/lang/String;)Z
              move-result v3
              if-nez v3, :cond_quick_access_exists
              const-string v3, "none"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;
              move-result-object v1
              :cond_quick_access_exists

              invoke-interface {v1}, Landroid/content/SharedPreferences$Editor;->apply()V
              invoke-super {p0, p1}, Lio/flutter/embedding/android/d;->onCreate(Landroid/os/Bundle;)V
              return-void
          .end method
          """
          p.write_text(s+method)
          print("Injected first-install-only SharedPreferences defaults: navigation_choice=dpad, quick_access_choice=none")
          PY
          apktool b work/apk -o "Remote_ATV_5.0.5_預設值修正_基礎版.apk"
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          apk=Path("Remote_ATV_5.0.5_預設值修正_基礎版.apk")
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              lib=z.read("lib/arm64-v8a/libapp.so")
              assert hashlib.sha256(lib).hexdigest()=="a2b7d7a37020a462dab8230f99fd10c00e927257328730af1f54856358ca6875"
              assert "classes3.dex" in z.namelist()
          print("Rebuilt base APK ZIP integrity: PASS")
          print("Original 5.0.5 libapp.so preserved byte-for-byte: PASS")
          PY

      - name: Disable automatic update check, dialog, and four settings rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, struct, zipfile
          from pathlib import Path

          src = Path("Remote_ATV_5.0.5_預設值修正_基礎版.apk")
          out = Path("Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版-unsigned.apk")
          expected_lib = "a2b7d7a37020a462dab8230f99fd10c00e927257328730af1f54856358ca6875"
          patch_specs = [
              (0x7505bc, "ba020094", "e00316aa", None, "disable automatic update check call"),
              (0x7505e8, "13000094", "e00316aa", None, "suppress update dialog dispatch"),
              (0x44cd78, "704b4091", "2e000014", 0x44ce30, "remove Share with friends row"),
              (0x44ceb0, "704b4091", "22000014", 0x44cf38, "remove Rate and Review row"),
              (0x44cfb8, "704b4091", "22000014", 0x44d040, "remove Feedback row"),
              (0x44d25c, "704b4091", "4c000014", 0x44d38c, "remove Activate premium row"),
          ]

          def sha(b): return hashlib.sha256(b).hexdigest()
          if not src.is_file():
              raise SystemExit(f"Missing exact target APK: {src}")
          apk_bytes = src.read_bytes()
          with zipfile.ZipFile(src, "r") as zin:
              names = zin.namelist()
              libname = "lib/arm64-v8a/libapp.so"
              if libname not in names:
                  raise SystemExit(f"Missing {libname}")
              lib = zin.read(libname)
              if sha(lib) != expected_lib:
                  raise SystemExit("libapp.so SHA256 mismatch; refusing to patch an unknown AOT snapshot.")
              if lib[:4] != b"\\x7fELF" or lib[4] != 2 or lib[5] != 1:
                  raise SystemExit("Unexpected libapp.so ELF format.")

              phoff = struct.unpack_from("<Q", lib, 32)[0]
              phentsize, phnum = struct.unpack_from("<HH", lib, 54)
              def va_to_fileoff(va):
                  for i in range(phnum):
                      p = phoff + i * phentsize
                      p_type, p_flags, p_offset, p_vaddr, _, p_filesz, _, _ = struct.unpack_from("<IIQQQQQQ", lib, p)
                      if p_type == 1 and (p_flags & 1) and p_vaddr <= va and va + 4 <= p_vaddr + p_filesz:
                          return p_offset + va - p_vaddr
                  raise SystemExit(f"VA 0x{va:x} is not inside an executable PT_LOAD segment.")

              patched = bytearray(lib)
              verified = []
              for va, old_hex, new_hex, expected_target, label in patch_specs:
                  off = va_to_fileoff(va)
                  old = bytes.fromhex(old_hex)
                  new = bytes.fromhex(new_hex)
                  actual = bytes(patched[off:off+4])
                  if actual != old:
                      raise SystemExit(f"{label}: unexpected instruction at VA 0x{va:x}: {actual.hex()} != {old.hex()}")
                  if expected_target is not None:
                      word = struct.unpack("<I", new)[0]
                      imm26 = word & 0x03ffffff
                      if imm26 & (1 << 25):
                          imm26 -= 1 << 26
                      branch_target = va + (imm26 << 2)
                      if branch_target != expected_target:
                          raise SystemExit(f"{label}: branch target mismatch 0x{branch_target:x}")
                  elif va in (0x7505bc, 0x7505e8):
                      word = struct.unpack("<I", old)[0]
                      imm26 = word & 0x03ffffff
                      if imm26 & (1 << 25):
                          imm26 -= 1 << 26
                      expected_call = 0x7510a4 if va == 0x7505bc else 0x750634
                      if va + (imm26 << 2) != expected_call:
                          raise SystemExit(f"Unexpected original updater BL target at 0x{va:x}.")
                  patched[off:off+4] = new
                  verified.append((va, off, new, label, expected_target))

              changed = [i for i, (a, b) in enumerate(zip(lib, patched)) if a != b]
              if len(changed) != 24:
                  raise SystemExit(f"Unexpected patch footprint: {len(changed)} changed bytes, expected 24.")
              if sha(bytes(patched)) == sha(lib):
                  raise SystemExit("Patch did not change libapp.so.")

              with zipfile.ZipFile(out, "w") as zout:
                  for info in zin.infolist():
                      payload = bytes(patched) if info.filename == libname else zin.read(info.filename)
                      zout.writestr(info, payload)

          with zipfile.ZipFile(out, "r") as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity failure: {bad}")
              checklib = check.read("lib/arm64-v8a/libapp.so")
              for va, off, new, label, expected_target in verified:
                  if checklib[off:off+4] != new:
                      raise SystemExit(f"Post-ZIP verification failed: {label}")
              for name in names:
                  if name != "lib/arm64-v8a/libapp.so":
                      with zipfile.ZipFile(src, "r") as original:
                          if check.read(name) != original.read(name):
                              raise SystemExit(f"Unexpected modified APK entry: {name}")

          print(f"APK input SHA256: {sha(apk_bytes)}")
          print(f"Original libapp SHA256: {sha(lib)}")
          print(f"Patched libapp SHA256: {sha(bytes(patched))}")
          for va, off, new, label, expected_target in verified:
              suffix = f" -> branch 0x{expected_target:x}" if expected_target is not None else " -> null (skip call)"
              print(f"PATCH PASS: 0x{va:x} (file 0x{off:x}) {label}{suffix}; bytes={new.hex()}")
          print("Only lib/arm64-v8a/libapp.so changed; all other APK entries verified identical.")
          PY

      - name: Align and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          "$BT/zipalign" -f -p 4 "Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版-unsigned.apk" "Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版-aligned.apk"
          keytool -genkeypair -v -keystore test-debug.keystore -storepass android -alias remote-atv-test -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Remote ATV Test,O=Debug,C=TW"
          "$BT/apksigner" sign --ks test-debug.keystore --ks-key-alias remote-atv-test --ks-pass pass:android --key-pass pass:android --out "Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版.apk" "Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版-aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版.apk"
          "$BT/zipalign" -c -p 4 "Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版.apk"

      - name: Runtime-independent APK and patch checks
        shell: bash
        run: |
          set -euo pipefail
          apk="Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版.apk"
          python3 - <<'PY'
          import hashlib, struct, zipfile
          from pathlib import Path
          apk=Path("Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版.apk")
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              lib=z.read("lib/arm64-v8a/libapp.so")
              phoff=struct.unpack_from("<Q",lib,32)[0]
              pe,pn=struct.unpack_from("<HH",lib,54)
              def off_for(va):
                  for i in range(pn):
                      p=phoff+i*pe
                      typ,flags,po,pv,_,fs,_,_=struct.unpack_from("<IIQQQQQQ",lib,p)
                      if typ==1 and flags&1 and pv<=va and va+4<=pv+fs:
                          return po+va-pv
                  raise AssertionError(f"missing executable VA 0x{va:x}")
              expected={
                  0x7505bc:"e00316aa",
                  0x7505e8:"e00316aa",
                  0x44cd78:"2e000014",
                  0x44ceb0:"22000014",
                  0x44cfb8:"22000014",
                  0x44d25c:"4c000014",
              }
              for va,hexbytes in expected.items():
                  off=off_for(va)
                  assert lib[off:off+4]==bytes.fromhex(hexbytes), (hex(va),lib[off:off+4].hex())
              assert "AndroidManifest.xml" in z.namelist()
          print("ZIP integrity: PASS")
          print("AOT update-check bypass instruction at VA 0x7505e8: PASS")
          print("AndroidManifest present: PASS")
          print("Signed APK SHA256:",hashlib.sha256(apk.read_bytes()).hexdigest())
          PY
          apktool d -f -r "$apk" -o work/final-check
          MAIN="work/final-check/smali_classes3/tech/simha/androidtvremote/MainActivity.smali"
          grep -q 'flutter.navigation_choice' "$MAIN"
          grep -q 'flutter.quick_access_choice' "$MAIN"
          grep -q 'const-string v3, "dpad"' "$MAIN"
          grep -q 'const-string v3, "none"' "$MAIN"
          grep -q 'SharedPreferences\$Editor;->apply()V' "$MAIN"
          grep -q 'onCreate(Landroid/os/Bundle;)V' "$MAIN"
          aapt dump badging "$apk" | grep -E "package: name='tech.simha.androidtvremote'.*versionCode='29'.*versionName='5.0.5'"
          echo "First-install preference defaults in signed DEX: PASS"
          echo "Package/version metadata 5.0.5: PASS"

      - name: Upload patched debug APK and report
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-defaults-no-update-debug
          path: |
            Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版.apk
            Remote_ATV_5.0.5_預設值修正_停用更新提示_除錯版-unsigned.apk
          if-no-files-found: error
          retention-days: 14

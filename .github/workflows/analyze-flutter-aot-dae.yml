name: Analyze Remote ATV 5.0.5 Flutter AOT with DAE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DAE analyzer and Dart 2.13.4 compressed-pointer profile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/ejfkdev/dae/releases/latest/download/dae-Linux-x64 -o /tmp/dae
          chmod +x /tmp/dae
          /tmp/dae version
          mkdir -p work/analysis work/diagnostics
          curl -fL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/ejfkdev/dae/main/profiles/sdk/dart-2.13.4-w32-compressed.json \
            -o work/analysis/dart-2.13.4-w32-compressed.json
          test -s work/analysis/dart-2.13.4-w32-compressed.json
          sha256sum work/analysis/dart-2.13.4-w32-compressed.json | tee work/diagnostics/profile.sha256

      - name: Extract Flutter libapp.so
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          test -f "$APK"
          unzip -p "$APK" lib/arm64-v8a/libapp.so > work/analysis/libapp.so
          test -s work/analysis/libapp.so
          file work/analysis/libapp.so | tee work/diagnostics/elf.txt
          sha256sum work/analysis/libapp.so | tee work/diagnostics/libapp.sha256

      - name: Analyze with explicit compressed-pointer SDK profile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          PROFILE="work/analysis/dart-2.13.4-w32-compressed.json"
          BIN="work/analysis/libapp.so"
          /tmp/dae export "$BIN" work/dae-out --sdk-profile "$PROFILE" > work/diagnostics/export-profile.txt 2>&1
          echo "export explicit profile exit=$?" >> work/diagnostics/exit-codes.txt
          /tmp/dae info "$BIN" > work/diagnostics/info-auto.txt 2>&1
          echo "info auto exit=$?" >> work/diagnostics/exit-codes.txt
          /tmp/dae strings "$BIN" -f "电视" > work/diagnostics/strings-auto.txt 2>&1
          echo "strings auto exit=$?" >> work/diagnostics/exit-codes.txt
          find work -maxdepth 4 -type f -printf '%p %s bytes\n' > work/diagnostics/files.txt
          exit 0

      - name: Upload DAE profile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-DAE-profile-test
          path: |
            work/diagnostics/
            work/dae-out/
            work/analysis/dart-2.13.4-w32-compressed.json
          if-no-files-found: warn
          retention-days: 14

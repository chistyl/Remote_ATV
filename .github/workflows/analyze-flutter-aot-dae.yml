name: Analyze Remote ATV 5.0.5 Flutter AOT with DAE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Remote ATV repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build DAE directly from current upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ejfkdev/dae.git work/dae-source
          echo "DAE source commit: $(git -C work/dae-source rev-parse HEAD)" | tee work/dae-source-commit.txt
          cargo build --release --manifest-path work/dae-source/Cargo.toml
          install -m 0755 work/dae-source/target/release/dae /tmp/dae
          /tmp/dae version 2>&1 | tee work/dae-version.txt
          sha256sum /tmp/dae | tee work/dae-binary.sha256

      - name: Extract Flutter libapp.so
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/analysis work/diagnostics
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          test -f "$APK"
          unzip -p "$APK" lib/arm64-v8a/libapp.so > work/analysis/libapp.so
          test -s work/analysis/libapp.so
          file work/analysis/libapp.so | tee work/diagnostics/elf.txt
          sha256sum work/analysis/libapp.so | tee work/diagnostics/libapp.sha256

      - name: Scan raw Flutter AOT strings for update logic
        shell: bash
        run: |
          set -euo pipefail
          BIN="work/analysis/libapp.so"
          mkdir -p work/diagnostics
          strings -a -n 4 "$BIN" > work/diagnostics/libapp-strings-utf8.txt
          strings -a -el -n 4 "$BIN" > work/diagnostics/libapp-strings-utf16le.txt
          {
            echo "=== UTF-8 matches ==="
            grep -Ein -C 2 'update|upgrade|version|force|later|tv_app_version|upgrader|更新|版本|稍後|立即' work/diagnostics/libapp-strings-utf8.txt || true
            echo
            echo "=== UTF-16LE matches ==="
            grep -Ein -C 2 'update|upgrade|version|force|later|tv_app_version|upgrader|更新|版本|稍後|立即' work/diagnostics/libapp-strings-utf16le.txt || true
          } > work/diagnostics/update-string-scan.txt
          wc -l work/diagnostics/libapp-strings-utf8.txt work/diagnostics/libapp-strings-utf16le.txt | tee work/diagnostics/string-counts.txt

      - name: Analyze with DAE automatic SDK detection
        id: analyze
        shell: bash
        continue-on-error: true
        run: |
          set +e
          BIN="work/analysis/libapp.so"
          /tmp/dae info "$BIN" > work/diagnostics/info-auto.txt 2>&1
          echo "info exit=$?" >> work/diagnostics/exit-codes.txt
          /tmp/dae export "$BIN" work/dae-out > work/diagnostics/export-auto.txt 2>&1
          echo "export exit=$?" >> work/diagnostics/exit-codes.txt
          /tmp/dae strings "$BIN" -f "电视" > work/diagnostics/strings-simplified-chinese.txt 2>&1
          echo "strings Chinese exit=$?" >> work/diagnostics/exit-codes.txt
          /tmp/dae strings "$BIN" -f "連線" > work/diagnostics/strings-traditional-chinese.txt 2>&1
          echo "strings Traditional Chinese exit=$?" >> work/diagnostics/exit-codes.txt
          find work/dae-out work/diagnostics -maxdepth 5 -type f -printf '%p %s bytes\n' 2>/dev/null | sort > work/diagnostics/files.txt
          exit 0

      - name: Upload DAE source-build analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-DAE-source-build
          path: |
            work/dae-source-commit.txt
            work/dae-version.txt
            work/dae-binary.sha256
            work/diagnostics/
            work/dae-out/
          if-no-files-found: warn
          retention-days: 14

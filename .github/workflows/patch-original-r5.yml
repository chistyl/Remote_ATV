name: Patch original Remote ATV 5.0.5 R5
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-original-r5.yml"
    branches:
      - rebuild/remote-atv-5
permissions:
  contents: read
jobs:
  patch-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Patch original AOT and verify all guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, hashlib, os
          src='input/Remote_ATV_5.0.5_原版介面保留_停用更新檢查_測試候選.apk'
          out='Remote_ATV_5.0.5_R5_原版介面_預設修正_移除四項選單_停用更新_unsigned.apk'
          expected_lib='a2b7d7a37020a462dab8230f99fd10c00e927257328730af1f54856358ca6875'
          patches={
            0x25d4a0:('60e74091','60eb44f9'),0x25d4a4:('00e844f9','1f2003d5'),
            0x265260:('60e74091','60eb44f9'),0x265264:('00e444f9','1f2003d5'),
            0x282220:('60e34091','60eb44f9'),0x282224:('002c46f9','1f2003d5'),
            0x3a03b4:('60e74091','60eb44f9'),0x3a03b8:('007044f9','1f2003d5'),
            0x44cdc8:('21bc44f9','e10316aa'),0x44cf00:('21c444f9','e10316aa'),
            0x44d008:('21cc44f9','e10316aa'),0x44d2ac:('21dc44f9','e10316aa'),
            0x4abdf0:('81000054','04000014'),0x4abe18:('81000054','04000014'),
            0x4abe38:('81000054','04000014'),0x7505bc:('ba020094','e00316aa'),
            0x7505e8:('13000094','e00316aa')}
          with zipfile.ZipFile(src) as z:
            assert z.testzip() is None
            names=z.namelist()
            entries={n:z.read(n) for n in names if n not in ('META-INF/MANIFEST.MF',) and not (n.startswith('META-INF/') and n.upper().endswith(('.SF','.RSA','.DSA','.EC')))}
            libname='lib/arm64-v8a/libapp.so'
            lib=bytearray(entries[libname])
            assert hashlib.sha256(lib).hexdigest()==expected_lib, 'AOT SHA256 mismatch'
            for off,(old,new) in patches.items():
              assert lib[off:off+4]==bytes.fromhex(old), f'guard mismatch at {off:#x}'
              lib[off:off+4]=bytes.fromhex(new)
            entries[libname]=bytes(lib)
            with zipfile.ZipFile(out,'w',allowZip64=True) as w:
              for n in names:
                if n in entries: w.writestr(n,entries[n],compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          with zipfile.ZipFile(out) as z:
            assert z.testzip() is None
            lib=z.read(libname)
            for off,(_,new) in patches.items(): assert lib[off:off+4]==bytes.fromhex(new)
          print('17 AOT patch guards PASS; ZIP integrity PASS')
          print('Unsigned APK SHA256:',hashlib.sha256(open(out,'rb').read()).hexdigest())
          PY
      - name: Install Android Build Tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "build-tools;35.0.0"
      - name: Align, sign V1 and V2, verify
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 Remote_ATV_5.0.5_R5_原版介面_預設修正_移除四項選單_停用更新_unsigned.apk aligned.apk
          keytool -genkeypair -keystore r5-debug.keystore -storepass android -keypass android -alias remoteatv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Remote ATV R5,O=Remote ATV,C=TW"
          "$BT/apksigner" sign --ks r5-debug.keystore --ks-key-alias remoteatv --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out Remote_ATV_5.0.5_R5_原版介面_預設修正_移除四項選單_停用更新.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Remote_ATV_5.0.5_R5_原版介面_預設修正_移除四項選單_停用更新.apk
          "$BT/zipalign" -c -v 4 Remote_ATV_5.0.5_R5_原版介面_預設修正_移除四項選單_停用更新.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-R5-original-ui-signed
          path: Remote_ATV_5.0.5_R5_原版介面_預設修正_移除四項選單_停用更新.apk
          retention-days: 14

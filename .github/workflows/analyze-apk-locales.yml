name: Analyze Remote ATV APK locales

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-apk-locales.yml'

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APKTool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Decode Android resources
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          test -s "$APK"
          java -jar apktool.jar d -f "$APK" -o decoded
          find decoded/res -type f -path '*/values*/*' -name '*.xml' -print0 | xargs -0 grep -nH -E '[一-龥]' > chinese-resource-lines.txt || true
          grep -nH -E '[一-龥]' decoded/res/values*/strings.xml >> chinese-resource-lines.txt 2>/dev/null || true
          echo "Decoded resource files: $(find decoded/res -type f | wc -l)"
          echo "Chinese resource lines: $(wc -l < chinese-resource-lines.txt)"
          grep -RniE 'update|upgrade|version|force_update|later_update|更新|版本|稍後|立即' decoded/res decoded/AndroidManifest.xml > update-resource-scan.txt || true
          echo "Update-related Android resource matches: $(wc -l < update-resource-scan.txt)"
          grep -RniE 'upgrader|force_update|optional_update|update_now|later_update|updateDialog|appUpdate|versionCheck|UPDATE NOW|LATER|check.?for.?updates|in_app_update|play.core.appupdate' decoded/smali* > update-smali-scan.txt || true
          echo "Update-related DEX matches: $(wc -l < update-smali-scan.txt)"
          {
            echo 'APK identity:'
            grep -E 'versionCode|versionName|package=' decoded/apktool.yml decoded/AndroidManifest.xml | head -20 || true
            echo 'Flutter engine / Dart version markers:'
            find decoded/lib -name 'libflutter.so' -o -name 'libapp.so' | while read -r so; do
              echo "--- $so ---"
              file "$so"
              readelf -n "$so" 2>/dev/null | grep -E 'Build ID|GNU' | head -5 || true
              strings "$so" | grep -iE -m 30 'Dart VM version|Dart SDK version|Flutter [0-9]+\.|version [0-9]+\.[0-9]+\.[0-9]+|snapshot version' || true
            done
          } > flutter-engine-version-scan.txt

      - name: Package analysis output
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-locale-analysis
          path: |
            decoded/res/
            decoded/apktool.yml
            chinese-resource-lines.txt
            update-resource-scan.txt
            update-smali-scan.txt
            flutter-engine-version-scan.txt
            decoded/smali*/
            decoded/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 14

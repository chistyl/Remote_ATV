name: Analyze Remote ATV APK locales

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-apk-locales.yml'

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APKTool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Decode Android resources
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          test -s "$APK"
          java -jar apktool.jar d -f "$APK" -o decoded
          find decoded/res -type f -path '*/values*/*' -name '*.xml' -print0 | xargs -0 grep -nH -E '[一-龥]' > chinese-resource-lines.txt || true
          grep -nH -E '[一-龥]' decoded/res/values*/strings.xml >> chinese-resource-lines.txt 2>/dev/null || true
          echo "Decoded resource files: $(find decoded/res -type f | wc -l)"
          echo "Chinese resource lines: $(wc -l < chinese-resource-lines.txt)"
          grep -RniE 'update|upgrade|version|force_update|later_update|更新|版本|稍後|立即' decoded/res decoded/AndroidManifest.xml > update-resource-scan.txt || true
          echo "Update-related Android resource matches: $(wc -l < update-resource-scan.txt)"
          grep -RniE 'upgrader|force_update|optional_update|update_now|later_update|updateDialog|appUpdate|versionCheck|UPDATE NOW|LATER|check.?for.?updates|in_app_update|play.core.appupdate' decoded/smali* > update-smali-scan.txt || true
          echo "Update-related DEX matches: $(wc -l < update-smali-scan.txt)"
          {
            echo 'APK identity:'
            grep -E 'versionCode|versionName|package=' decoded/apktool.yml decoded/AndroidManifest.xml | head -20 || true
            echo 'Flutter engine / Dart version markers:'
            find decoded/lib -name 'libflutter.so' -o -name 'libapp.so' | while read -r so; do
              echo "--- $so ---"
              file "$so"
              readelf -n "$so" 2>/dev/null | grep -E 'Build ID|GNU' | head -5 || true
              strings "$so" | grep -iE -m 30 'Dart VM version|Dart SDK version|Flutter [0-9]+\.|version [0-9]+\.[0-9]+\.[0-9]+|snapshot version' || true
            done
          } > flutter-engine-version-scan.txt

      - name: Verify prior update-dialog code locations
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          mkdir -p work
          unzip -p "$APK" lib/arm64-v8a/libapp.so > work/libapp.so
          test -s work/libapp.so
          readelf -h -lW work/libapp.so > work/libapp-elf.txt
          python3 - <<'PY'
          import struct
          path = "work/libapp.so"
          targets = [0x4a8334, 0x4aa3c8, 0x4aa308, 0x4aa034]
          data = open(path, "rb").read()
          if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
              raise SystemExit("Expected ELF64 little-endian libapp.so")
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize, phnum = struct.unpack_from("<HH", data, 54)
          loads = []
          for i in range(phnum):
              off = phoff + i * phentsize
              p_type, p_flags = struct.unpack_from("<II", data, off)
              p_offset, p_vaddr, p_paddr, p_filesz, p_memsz, p_align = struct.unpack_from("<QQQQQQ", data, off+8)
              if p_type == 1:
                  loads.append((p_vaddr, p_offset, p_filesz, p_flags))
          with open("work/update-dialog-address-check.txt", "w") as out:
              for va in targets:
                  matches = [(v, o, n, fl) for v,o,n,fl in loads if v <= va < v+n]
                  out.write(f"VA 0x{va:x}: ")
                  if not matches:
                      out.write("NOT IN FILE-BACKED PT_LOAD SEGMENT\\n")
                      continue
                  v,o,n,fl = matches[0]
                  fo = o + (va-v)
                  out.write(f"file_offset=0x{fo:x}, segment_flags=0x{fl:x}, bytes=")
                  out.write(data[fo:fo+32].hex(" ") + "\\n")
          PY
          python3 -m pip install --quiet capstone
          python3 - <<'PY'
          import struct
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          data=open("work/libapp.so","rb").read()
          phoff=struct.unpack_from("<Q",data,32)[0]
          entsize,num=struct.unpack_from("<HH",data,54)
          loads=[]
          for i in range(num):
              o=phoff+i*entsize
              typ,flags=struct.unpack_from("<II",data,o)
              po,pv,_,fs,_,_=struct.unpack_from("<QQQQQQ",data,o+8)
              if typ==1: loads.append((pv,po,fs,flags))
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          with open("work/update-dialog-disassembly.txt","w") as out:
              for va in [0x4a8334,0x4aa3c8,0x4aa308,0x4aa034]:
                  seg=next(((v,o,n,f) for v,o,n,f in loads if v<=va<v+n and f&1),None)
                  out.write(f"\\n=== VA 0x{va:x} ===\\n")
                  if not seg:
                      out.write("Not in executable file-backed segment\\n"); continue
                  v,o,n,f=seg
                  fo=o+(va-v)
                  start=max(o,fo-32); end=min(o+n,fo+128)
                  for ins in md.disasm(data[start:end], v+(start-o)):
                      out.write(f"0x{ins.address:x}: {ins.mnemonic} {ins.op_str}\\n")
          PY
      - name: Package analysis output
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-locale-analysis
          path: |
            decoded/res/
            decoded/apktool.yml
            chinese-resource-lines.txt
            update-resource-scan.txt
            update-smali-scan.txt
            flutter-engine-version-scan.txt
            decoded/smali*/
            decoded/AndroidManifest.xml
            work/libapp-elf.txt
            work/update-dialog-address-check.txt
            work/update-dialog-disassembly.txt
          if-no-files-found: error
          retention-days: 14

name: Analyze Remote ATV APK locales

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-apk-locales.yml'

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APKTool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Decode Android resources
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          test -s "$APK"
          java -jar apktool.jar d -f "$APK" -o decoded
          find decoded/res -type f -path '*/values*/*' -name '*.xml' -print0 | xargs -0 grep -nH -E '[一-龥]' > chinese-resource-lines.txt || true
          grep -nH -E '[一-龥]' decoded/res/values*/strings.xml >> chinese-resource-lines.txt 2>/dev/null || true
          echo "Decoded resource files: $(find decoded/res -type f | wc -l)"
          echo "Chinese resource lines: $(wc -l < chinese-resource-lines.txt)"
          grep -RniE 'update|upgrade|version|force_update|later_update|更新|版本|稍後|立即' decoded/res decoded/AndroidManifest.xml > update-resource-scan.txt || true
          echo "Update-related Android resource matches: $(wc -l < update-resource-scan.txt)"
          grep -RniE 'upgrader|force_update|optional_update|update_now|later_update|updateDialog|appUpdate|versionCheck|UPDATE NOW|LATER|check.?for.?updates|in_app_update|play.core.appupdate' decoded/smali* > update-smali-scan.txt || true
          echo "Update-related DEX matches: $(wc -l < update-smali-scan.txt)"
          {
            echo 'APK identity:'
            grep -E 'versionCode|versionName|package=' decoded/apktool.yml decoded/AndroidManifest.xml | head -20 || true
            echo 'Flutter engine / Dart version markers:'
            find decoded/lib -name 'libflutter.so' -o -name 'libapp.so' | while read -r so; do
              echo "--- $so ---"
              file "$so"
              readelf -n "$so" 2>/dev/null | grep -E 'Build ID|GNU' | head -5 || true
              strings "$so" | grep -iE -m 30 'Dart VM version|Dart SDK version|Flutter [0-9]+\.|version [0-9]+\.[0-9]+\.[0-9]+|snapshot version' || true
            done
          } > flutter-engine-version-scan.txt

      - name: Verify prior update-dialog code locations
        shell: bash
        run: |
          set -euo pipefail
          APK="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          mkdir -p work
          unzip -p "$APK" lib/arm64-v8a/libapp.so > work/libapp.so
          test -s work/libapp.so
          readelf -h -lW work/libapp.so > work/libapp-elf.txt
          python3 - <<'PY'
          import struct
          path = "work/libapp.so"
          targets = [0x4a8334, 0x4aa3c8, 0x4aa308, 0x4aa034, 0x750448, 0x7510a4, 0x75125c, 0x751594, 0x4970fc, 0x4a7c60, 0x4a7cf4, 0x4a8124]
          data = open(path, "rb").read()
          if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
              raise SystemExit("Expected ELF64 little-endian libapp.so")
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize, phnum = struct.unpack_from("<HH", data, 54)
          loads = []
          for i in range(phnum):
              off = phoff + i * phentsize
              p_type, p_flags = struct.unpack_from("<II", data, off)
              p_offset, p_vaddr, p_paddr, p_filesz, p_memsz, p_align = struct.unpack_from("<QQQQQQ", data, off+8)
              if p_type == 1:
                  loads.append((p_vaddr, p_offset, p_filesz, p_flags))
          with open("work/update-dialog-address-check.txt", "w") as out:
              for va in targets:
                  matches = [(v, o, n, fl) for v,o,n,fl in loads if v <= va < v+n]
                  out.write(f"VA 0x{va:x}: ")
                  if not matches:
                      out.write("NOT IN FILE-BACKED PT_LOAD SEGMENT\\n")
                      continue
                  v,o,n,fl = matches[0]
                  fo = o + (va-v)
                  out.write(f"file_offset=0x{fo:x}, segment_flags=0x{fl:x}, bytes=")
                  out.write(data[fo:fo+32].hex(" ") + "\\n")
          PY
          python3 -m pip install --quiet capstone
          python3 - <<'PY'
          import struct
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          data=open("work/libapp.so","rb").read()
          phoff=struct.unpack_from("<Q",data,32)[0]
          entsize,num=struct.unpack_from("<HH",data,54)
          loads=[]
          for i in range(num):
              o=phoff+i*entsize
              typ,flags=struct.unpack_from("<II",data,o)
              po,pv,_,fs,_,_=struct.unpack_from("<QQQQQQ",data,o+8)
              if typ==1: loads.append((pv,po,fs,flags))
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          ranges = [
              ("update_dialog_builder", 0x4a8334, 0x4aa034),
              ("update_dialog_callback_1", 0x4aa3c8, 0x4aa520),
              ("update_dialog_callback_2", 0x4aa308, 0x4aa418),
              ("update_dialog_callback_3", 0x4aa034, 0x4aa1b0),
              ("upgrader_init", 0x750228, 0x75039c),
              ("upgrader_update_check", 0x75039c, 0x750448),
              ("upgrader_update_pipeline", 0x750448, 0x750700),
              ("upgrader_version_comparison", 0x7510a4, 0x7512b0),
              ("upgrader_update_decision", 0x75125c, 0x751594),
              ("upgrader_dialog_dispatch", 0x751594, 0x751a00),
              ("upgrader_prompt_decision", 0x750634, 0x750934),
              ("upgrader_prompt_result", 0x750934, 0x750b00),
              ("upgrader_version_gate", 0x7509d4, 0x750b20),
              ("upgrader_builder_and_dialog", 0x4a8334, 0x4aa520),
              ("update_prompt_decision_helpers", 0x4970fc, 0x497300),
              ("upgrader_state_helpers", 0x4a7c60, 0x4a7e20),
              ("upgrader_dialog_state", 0x4a8124, 0x4a81bc),
              ("upgrader_store_lookup", 0x74c17c, 0x74c500),
              ("upgrader_version_lookup", 0x752020, 0x752400),
          ]
          with open("work/update-dialog-disassembly.txt","w") as out:
              for name, begin, finish in ranges:
                  seg=next(((v,o,n,f) for v,o,n,f in loads if v<=begin<v+n and f&1),None)
                  out.write(f"\\n=== {name}: VA 0x{begin:x}-0x{finish:x} ===\\n")
                  if not seg:
                      out.write("Not in executable file-backed segment\\n"); continue
                  v,o,n,f=seg
                  start=o+(begin-v)
                  end=min(o+n, o+(finish-v))
                  for ins in md.disasm(data[start:end], begin):
                      out.write(f"0x{ins.address:x}: {ins.mnemonic} {ins.op_str}\\n")
          PY
      - name: Compare baseline and supplied update-disabled candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          CAND="input/Remote_ATV_5.0.5_停用更新檢查_候選版.apk"
          mkdir -p compare/base compare/candidate
          sha256sum "$BASE" "$CAND" | tee work/apk-sha256.txt
          unzip -p "$BASE" lib/arm64-v8a/libapp.so > work/base-libapp.so
          unzip -p "$CAND" lib/arm64-v8a/libapp.so > work/candidate-libapp.so
          sha256sum work/base-libapp.so work/candidate-libapp.so | tee work/libapp-sha256.txt
          cmp -s work/base-libapp.so work/candidate-libapp.so && echo "libapp_identical=yes" >> work/candidate-comparison.txt || echo "libapp_identical=no" >> work/candidate-comparison.txt
          unzip -p "$BASE" classes.dex > work/base-classes.dex
          unzip -p "$CAND" classes.dex > work/candidate-classes.dex
          cmp -s work/base-classes.dex work/candidate-classes.dex && echo "classes_dex_identical=yes" >> work/candidate-comparison.txt || echo "classes_dex_identical=no" >> work/candidate-comparison.txt
          unzip -p "$CAND" META-INF/MANIFEST.MF > work/candidate-manifest.txt 2>/dev/null || true
          echo "Candidate APK metadata:" >> work/candidate-comparison.txt
          for item in baseline candidate; do
            if [ "$item" = baseline ]; then apk="$BASE"; else apk="$CAND"; fi
            unzip -p "$apk" lib/arm64-v8a/libapp.so | strings | grep -iE 'upgrader|UPDATE NOW|LATER|force_update_dialog_shown|optional_update_dialog_shown|userIgnoredVersion|update_dialog_app_version|tv_app_version|更新資訊|更新' > "work/${item}-update-strings.txt" || true
          done
          echo "Baseline/candidate update-string counts:" >> work/candidate-comparison.txt
          wc -l work/baseline-update-strings.txt work/candidate-update-strings.txt >> work/candidate-comparison.txt
          echo "Candidate update strings compared with baseline:" >> work/candidate-comparison.txt
          diff -u work/baseline-update-strings.txt work/candidate-update-strings.txt >> work/candidate-update-strings.diff || true
      - name: Locate exact Flutter update-code differences
        shell: bash
        run: |
          set -euo pipefail
          BASE="input/Remote_ATV_5.0.5_繁體中文_候選版.apk"
          CAND="input/Remote_ATV_5.0.5_停用更新檢查_候選版.apk"
          unzip -p "$BASE" lib/arm64-v8a/libapp.so > work/base-libapp.so
          unzip -p "$CAND" lib/arm64-v8a/libapp.so > work/candidate-libapp.so
          strings -a -t x work/base-libapp.so | grep -iE 'upgrader|UPDATE NOW|LATER|force_update_dialog_shown|optional_update_dialog_shown|userIgnoredVersion|update_dialog_app_version|tv_app_version|更新資訊|更新' > work/baseline-update-string-offsets.txt || true
          strings -a -t x work/candidate-libapp.so | grep -iE 'upgrader|UPDATE NOW|LATER|force_update_dialog_shown|optional_update_dialog_shown|userIgnoredVersion|update_dialog_app_version|tv_app_version|更新資訊|更新' > work/candidate-update-string-offsets.txt || true
          python3 - <<'PY'
          import struct, os
          a=open("work/base-libapp.so","rb").read()
          b=open("work/candidate-libapp.so","rb").read()
          if len(a)!=len(b):
              raise SystemExit(f"libapp size mismatch: baseline={len(a)} candidate={len(b)}")
          diffs=[i for i,(x,y) in enumerate(zip(a,b)) if x!=y]
          def segments(xs,gap=32):
              if not xs: return []
              out=[]; start=prev=xs[0]
              for x in xs[1:]:
                  if x-prev>gap:
                      out.append((start,prev+1)); start=x
                  prev=x
              out.append((start,prev+1))
              return out
          phoff=struct.unpack_from("<Q",a,32)[0]
          entsize,num=struct.unpack_from("<HH",a,54)
          loads=[]
          for i in range(num):
              o=phoff+i*entsize
              typ,flags=struct.unpack_from("<II",a,o)
              po,pv,_,fs,_,_=struct.unpack_from("<QQQQQQ",a,o+8)
              if typ==1: loads.append((po,po+fs,pv,flags))
          with open("work/flutter-binary-diff-map.txt","w") as out:
              out.write(f"baseline_size={len(a)} candidate_size={len(b)} changed_bytes={len(diffs)} changed_percent={len(diffs)/len(a)*100:.6f}%\\n")
              ranges=segments(diffs)
              out.write(f"changed_regions_gap32={len(ranges)}\\n")
              for idx,(s,e) in enumerate(ranges):
                  seg=next((x for x in loads if x[0]<=s<x[1]),None)
                  va=(seg[2]+s-seg[0]) if seg else None
                  out.write(f"[{idx:04d}] file=0x{s:x}-0x{e:x} length={e-s}")
                  if va is not None: out.write(f" va=0x{va:x} executable={bool(seg[3]&1)}")
                  out.write(f"\\nbaseline={a[s:min(e,s+48)].hex(' ')}\\ncandidate={b[s:min(e,s+48)].hex(' ')}\\n")
              out.write("\\nExecutable changed regions only:\\n")
              for s,e in ranges:
                  seg=next((x for x in loads if x[0]<=s<x[1] and x[3]&1),None)
                  if seg:
                      va=seg[2]+s-seg[0]
                      out.write(f"file=0x{s:x} va=0x{va:x} length={e-s}\\n")
          PY
      - name: Compare all printable Flutter strings
        shell: bash
        run: |
          set -euo pipefail
          strings -a -t x work/base-libapp.so > work/baseline-all-strings.txt
          strings -a -t x work/candidate-libapp.so > work/candidate-all-strings.txt
          diff -u work/baseline-all-strings.txt work/candidate-all-strings.txt > work/all-strings.diff || true
          {
            echo "Baseline printable strings: $(wc -l < work/baseline-all-strings.txt)"
            echo "Candidate printable strings: $(wc -l < work/candidate-all-strings.txt)"
            echo "Changed printable string lines: $(grep -Ec '^[+-][^+-]' work/all-strings.diff || true)"
            echo "Changed string diff preview:"
            sed -n '1,240p' work/all-strings.diff
          } > work/all-strings-summary.txt
      - name: Decompile Flutter AOT snapshot with Blutter
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-requests cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          mkdir -p work/base-lib
          unzip -p "input/Remote_ATV_5.0.5_繁體中文_候選版.apk" lib/arm64-v8a/libapp.so > work/base-lib/libapp.so
          unzip -p "input/Remote_ATV_5.0.5_繁體中文_候選版.apk" lib/arm64-v8a/libflutter.so > work/base-lib/libflutter.so
          git clone --depth 1 https://github.com/worawit/blutter.git work/blutter-src
          python3 work/blutter-src/blutter.py work/base-lib work/blutter-base
          {
            echo "Blutter output files:"
            find work/blutter-base -maxdepth 3 -type f | sort | head -300
            echo
            echo "Updater-related AOT references:"
            grep -RniE 'upgrader|force_update_dialog_shown|optional_update_dialog_shown|userIgnoredVersion|UPDATE NOW|later_update_button_press|update_dialog_app_version|tv_app_version|minAppVersion|isUpdateAvailable' work/blutter-base --exclude='*.so' || true
          } > work/blutter-updater-matches.txt
      - name: Trace updater dialog call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          data=open("work/libapp.so","rb").read()
          phoff=struct.unpack_from("<Q",data,32)[0]
          entsize,num=struct.unpack_from("<HH",data,54)
          loads=[]
          for i in range(num):
              o=phoff+i*entsize
              typ,flags=struct.unpack_from("<II",data,o)
              po,pv,_,fs,_,_=struct.unpack_from("<QQQQQQ",data,o+8)
              if typ==1 and flags&1: loads.append((pv,po,fs))
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          targets={0x4a8334:"dialog_builder",0x4aa3c8:"dialog_callback_later",0x4aa308:"dialog_callback_update",0x4aa034:"dialog_callback_dismiss",0x75212c:"update_decision_helper",0x4a8124:"version_compare_helper",0x750228:"upgrader_initialize",0x750448:"upgrader_process",0x750634:"upgrader_metadata_gate"}
          hits={k:[] for k in targets}
          for va,off,size in loads:
              code=data[off:off+size]
              for ins in md.disasm(code,va):
                  if ins.mnemonic in ("bl","b"):
                      try: dst=int(ins.op_str.split(",")[0].strip().lstrip("#"),0)
                      except Exception: continue
                      if dst in hits: hits[dst].append((ins.address,ins.mnemonic))
          with open("work/updater-call-sites.txt","w") as out:
              for target,name in targets.items():
                  out.write(f"\\n=== {name} target=0x{target:x} calls={len(hits[target])} ===\\n")
                  for site,mn in hits[target]:
                      out.write(f"callsite=0x{site:x} instruction={mn}\\n")
                      seg=next((x for x in loads if x[0]<=site<x[0]+x[2]),None)
                      if not seg: continue
                      v,o,n=seg; start=max(o, o+(site-v)-48); end=min(o+n,o+(site-v)+64)
                      for ins in md.disasm(data[start:end],v+(start-o)):
                          out.write(f"  0x{ins.address:x}: {ins.mnemonic} {ins.op_str}\\n")
          PY
          {
            echo 'Updater object/class context:'
            grep -nE 'AnonymousClosure: \\(0x(4a8334|4aa3c8|4aa308|4aa034|752874|750228)\\)|upgrader.dialog.title|userIgnoredVersion|force_update_dialog_shown|optional_update_dialog_shown' work/blutter-base/pp.txt || true
          } >> work/updater-call-sites.txt
      - name: Package analysis output
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-locale-analysis
          path: |
            decoded/res/
            decoded/apktool.yml
            chinese-resource-lines.txt
            update-resource-scan.txt
            update-smali-scan.txt
            flutter-engine-version-scan.txt
            decoded/smali*/
            decoded/AndroidManifest.xml
            work/libapp.so
            work/libapp-elf.txt
            work/blutter-base/ida_script/addNames.py
            work/update-dialog-address-check.txt
            work/update-dialog-disassembly.txt
            work/apk-sha256.txt
            work/libapp-sha256.txt
            work/candidate-comparison.txt
            work/baseline-update-strings.txt
            work/candidate-update-strings.txt
            work/candidate-update-strings.diff
            work/baseline-update-string-offsets.txt
            work/candidate-update-string-offsets.txt
            work/flutter-binary-diff-map.txt
            work/all-strings.diff
            work/all-strings-summary.txt
            work/blutter-updater-matches.txt
            work/blutter-base/objs.txt
            work/blutter-base/pp.txt
            work/blutter-base/asm/
          if-no-files-found: error
          retention-days: 14

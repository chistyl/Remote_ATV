name: Remote ATV 5.0.5 native startup inspection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-startup-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install APK inspection tools
        run: sudo apt-get update && sudo apt-get install -y apktool unzip
      - name: Decode exact APK and inspect startup activity
        run: |
          set -euo pipefail
          mkdir -p work
          apktool d -f "input/Remote_ATV_5.0.5_繁體中文_候選版.apk" -o work/apk > work/apktool.log 2>&1
          {
            echo "=== Manifest activities ==="
            grep -n -A14 -B3 'android.intent.action.MAIN\|android.intent.category.LAUNCHER' work/apk/AndroidManifest.xml || true
            echo
            echo "=== MainActivity smali ==="
            find work/apk/smali* -type f -iname '*MainActivity*.smali' -print
            for f in $(find work/apk/smali* -type f -iname '*MainActivity*.smali'); do
              echo "--- $f"
              sed -n '1,240p' "$f"
            done
            echo
            echo "=== Shared preferences plugin classes ==="
            find work/apk/smali* -type f | grep -i 'SharedPreferencesPlugin' | head -20
            echo
            echo "=== Shared preference strings ==="
            grep -RniE 'FlutterSharedPreferences|flutter\.|getAll|setString' work/apk/smali* | head -100 || true
          } > work/native-inspection.txt
          cat work/native-inspection.txt
      - name: Upload native inspection
        uses: actions/upload-artifact@v4
        with:
          name: Remote-ATV-5.0.5-native-inspection
          path: |
            work/apktool.log
            work/native-inspection.txt
            work/apk/smali*/tech/simha/androidtvremote/
          if-no-files-found: warn
          retention-days: 14

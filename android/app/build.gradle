plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace "com.chistyl.remoteatv"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    packaging {
        resources {
            excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }
    // Reuse the original Remote ATV 5.0.5 package identity.
    // The new APK uses a different signing certificate, so uninstall the old app first.
    defaultConfig { applicationId "tech.simha.androidtvremote"; minSdk 23; targetSdk 35; versionCode 52; versionName "5.0.6" }
}
dependencies {
    implementation "org.bouncycastle:bcprov-jdk18on:1.80"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.80"
}
flutter { source "../.." }
